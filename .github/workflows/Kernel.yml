name: LEDE Linux 6.18 Kernel Checker

on:
  workflow_dispatch:

  schedule:
    # 每天 UTC 00:00
    # 北京时间 08:00
    - cron: "0 0 * * *"

permissions:
  contents: read

env:
  LEDE_REPO: https://github.com/coolsnowwolf/lede
  LEDE_BRANCH: master

jobs:

  # ============================================================
  # Job 1
  # 自动检测 / 测试 Linux 6.18
  # ============================================================

  kernel-check:

    runs-on: ubuntu-24.04

    outputs:
      kernel_version: ${{ steps.kernel.outputs.new_version }}
      current_kernel: ${{ steps.current.outputs.current }}
      kernel_ok: ${{ steps.result.outputs.kernel_ok }}
      ppp_ok: ${{ steps.ppp_result.outputs.ppp_ok }}

    steps:

      # ==========================================================
      # 1. 安装依赖
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-venv \
            rsync \
            unzip \
            wget \
            quilt \
            zstd \
            file \
            curl \
            bc \
            cpio \
            kmod \
            libelf-dev \
            patch \
            tar \
            xz-utils

      # ==========================================================
      # 2. Clone LEDE
      # ==========================================================

      - name: Clone LEDE
        shell: bash
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch "$LEDE_BRANCH" \
            "$LEDE_REPO" \
            lede

      # ==========================================================
      # 3. 显示版本
      # ==========================================================

      - name: Show LEDE version
        working-directory: lede
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "LEDE"
          echo "=========================================="

          echo "Repository:"
          echo "$LEDE_REPO"

          echo
          echo "Branch:"
          echo "$LEDE_BRANCH"

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          git log -1 --oneline

      # ==========================================================
      # 4. 检查 x86 配置
      # ==========================================================

      - name: Check x86 kernel configuration
        working-directory: lede
        shell: bash
        run: |
          set -e

          FILE="target/linux/x86/Makefile"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi

          echo "=========================================="
          echo "Original x86 kernel configuration"
          echo "=========================================="

          grep -E \
            'KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER' \
            "$FILE"

      # ==========================================================
      # 5. 找到 kernel-6.18
      # ==========================================================

      - name: Locate kernel-6.18
        working-directory: lede
        shell: bash
        run: |
          set -e

          FILE="include/kernel-6.18"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: kernel-6.18 not found"

            echo
            echo "Available kernel files:"

            find include \
              -maxdepth 1 \
              -type f \
              -name 'kernel-*' \
              -print |
            sort -V

            exit 1
          fi

          echo "Using:"
          echo "$FILE"

      # ==========================================================
      # 6. 当前 Linux 6.18
      # ==========================================================

      - name: Detect current Linux 6.18
        id: current
        working-directory: lede
        shell: bash
        run: |
          set -e

          FILE="include/kernel-6.18"

          CURRENT=$(
            grep '^LINUX_KERNEL_HASH-' "$FILE" |
            sed \
              -n \
              's/^LINUX_KERNEL_HASH-\([^[:space:]]*\)[[:space:]]*=.*/\1/p' |
            sort -V |
            tail -1
          )

          if [ -z "$CURRENT" ]; then
            echo "ERROR: Cannot detect Linux 6.18 version"
            cat "$FILE"
            exit 1
          fi

          echo
          echo "Current Linux:"
          echo "$CURRENT"

          case "$CURRENT" in
            6.18.*)
              ;;
            *)
              echo "ERROR: $CURRENT is not Linux 6.18.x"
              exit 1
              ;;
          esac

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 7. 获取 kernel.org 最新 6.18
      # ==========================================================

      - name: Get latest Linux 6.18
        id: kernel
        shell: bash
        run: |
          set -e

          PAGE=$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              https://www.kernel.org/pub/linux/kernel/v6.x/
          )

          LATEST=$(
            printf '%s\n' "$PAGE" |
            grep -oE \
              'linux-6\.18\.[0-9]+\.tar\.xz' |
            sed 's/^linux-//' |
            sed 's/\.tar\.xz$//' |
            sort -V |
            tail -1
          )

          if [ -z "$LATEST" ]; then
            echo "ERROR: Cannot find latest Linux 6.18.x"
            exit 1
          fi

          echo "=========================================="
          echo "Latest Linux 6.18:"
          echo "$LATEST"
          echo "=========================================="

          echo "new_version=$LATEST" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 8. 比较版本
      # ==========================================================

      - name: Compare versions
        id: compare
        shell: bash
        run: |
          set -e

          CURRENT="${{ steps.current.outputs.current }}"
          LATEST="${{ steps.kernel.outputs.new_version }}"

          echo "Current: $CURRENT"
          echo "Latest : $LATEST"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo
            echo "Already up to date."

            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo
            echo "Kernel update detected."

            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      # ==========================================================
      # 9. 下载最新 kernel
      # ==========================================================

      - name: Download Linux kernel
        if: steps.compare.outputs.update == 'true'
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.kernel.outputs.new_version }}"

          URL="https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${VERSION}.tar.xz"

          echo "Downloading:"
          echo "$URL"

          mkdir -p lede/dl

          wget \
            --progress=dot:giga \
            "$URL" \
            -O "lede/dl/linux-${VERSION}.tar.xz"

          test -f "lede/dl/linux-${VERSION}.tar.xz"

      # ==========================================================
      # 10. SHA256
      # ==========================================================

      - name: Calculate SHA256
        if: steps.compare.outputs.update == 'true'
        id: hash
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.kernel.outputs.new_version }}"

          HASH=$(
            sha256sum \
              "lede/dl/linux-${VERSION}.tar.xz" |
            awk '{print $1}'
          )

          echo "=========================================="
          echo "Kernel:"
          echo "$VERSION"
          echo
          echo "SHA256:"
          echo "$HASH"
          echo "=========================================="

          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 11. 更新 kernel-6.18
      # ==========================================================

      - name: Update kernel-6.18
        if: steps.compare.outputs.update == 'true'
        working-directory: lede
        shell: bash
        run: |
          set -e

          FILE="include/kernel-6.18"

          CURRENT="${{ steps.current.outputs.current }}"
          NEW="${{ steps.kernel.outputs.new_version }}"
          HASH="${{ steps.hash.outputs.hash }}"

          cp "$FILE" "${FILE}.backup"

          python3 <<PY

          from pathlib import Path
          import re

          path = Path("include/kernel-6.18")

          text = path.read_text()

          current = "$CURRENT"
          new = "$NEW"
          sha256 = "$HASH"

          m = re.fullmatch(
              r"6\.18\.(\d+)",
              new
          )

          if not m:
              raise SystemExit(
                  f"Invalid kernel version: {new}"
              )

          patch_version = m.group(1)

          # 更新版本
          text, count = re.subn(
              r"^LINUX_VERSION-6\.18\s*=.*$",
              f"LINUX_VERSION-6.18 = .{patch_version}",
              text,
              flags=re.MULTILINE
          )

          if count != 1:
              raise SystemExit(
                  "Cannot update LINUX_VERSION-6.18"
              )

          # 删除旧 hash
          text = re.sub(
              r"^LINUX_KERNEL_HASH-"
              + re.escape(current)
              + r"\s*=.*$\n?",
              "",
              text,
              flags=re.MULTILINE
          )

          # 删除可能已经存在的新 hash
          text = re.sub(
              r"^LINUX_KERNEL_HASH-"
              + re.escape(new)
              + r"\s*=.*$\n?",
              "",
              text,
              flags=re.MULTILINE
          )

          if not text.endswith("\n"):
              text += "\n"

          text += (
              f"LINUX_KERNEL_HASH-{new} = {sha256}\n"
          )

          path.write_text(text)

          PY

          echo
          echo "=========================================="
          echo "Updated kernel-6.18"
          echo "=========================================="

          cat "$FILE"

      # ==========================================================
      # 12. 强制 x86 使用 Linux 6.18
      # ==========================================================

      - name: Force x86 Linux 6.18
        working-directory: lede
        shell: bash
        run: |
          set -e

          FILE="target/linux/x86/Makefile"

          echo "=========================================="
          echo "x86 BEFORE"
          echo "=========================================="

          grep -E \
            'KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER' \
            "$FILE"

          echo
          echo "Force KERNEL_PATCHVER=6.18"

          sed -i \
            's/^KERNEL_PATCHVER:=6\.12$/KERNEL_PATCHVER:=6.18/' \
            "$FILE"

          echo
          echo "=========================================="
          echo "x86 AFTER"
          echo "=========================================="

          grep -E \
            'KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER' \
            "$FILE"

          if ! grep -q \
            '^KERNEL_PATCHVER:=6\.18$' \
            "$FILE"; then

            echo "ERROR: Failed to force Linux 6.18"
            exit 1
          fi

      # ==========================================================
      # 13. 配置 x86_64
      # ==========================================================

      - name: Configure x86_64
        working-directory: lede
        shell: bash
        run: |
          set -e

          export TERM=xterm

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          EOF

          make defconfig

      # ==========================================================
      # 14. 确认最终版本
      # ==========================================================

      - name: Verify Linux 6.18 configuration
        working-directory: lede
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL KERNEL CONFIGURATION"
          echo "=========================================="

          echo
          echo "x86 Makefile:"
          grep -E \
            'KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER' \
            target/linux/x86/Makefile

          echo
          echo "kernel-6.18:"
          cat include/kernel-6.18

          echo
          echo ".config:"
          grep -E \
            'CONFIG_TARGET_x86|CONFIG_KERNEL|TESTING' \
            .config || true

          echo
          echo "=========================================="

          grep -q \
            '^KERNEL_PATCHVER:=6\.18$' \
            target/linux/x86/Makefile

          echo "OK: x86 Kernel = 6.18"

      # ==========================================================
      # 15. 正常测试全部 patch
      # ==========================================================

      - name: Test all Linux 6.18 patches
        id: all_test
        working-directory: lede
        shell: bash
        run: |
          set +e

          export TERM=xterm

          echo "=========================================="
          echo "开始测试全部 Linux 6.18 Patch"
          echo "=========================================="

          make target/linux/prepare V=s \
            2>&1 |
            tee kernel_prepare_all.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "make exit code: $STATUS"

          if [ "$STATUS" -eq 0 ]; then
            echo "ALL_PATCH_OK=true" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "ALL_PATCH_OK=false" >> "$GITHUB_ENV"

          echo
          echo "=========================================="
          echo "全部 Patch 测试失败"
          echo "开始判断是否为 PPP 625"
          echo "=========================================="

          if grep -q \
            '625-v7.0-ppp-enable-TX-scatter-gather.patch' \
            kernel_prepare_all.log; then

            echo "PPP_625_FAILED=true" >> "$GITHUB_ENV"

            echo
            echo "Detected PPP 625 failure."

            exit 0
          fi

          echo
          echo "ERROR: Failure is NOT PPP 625."

          exit "$STATUS"

      # ==========================================================
      # 16. 单独测试 PPP 625
      #
      # 如果全部测试因为 625 失败，
      # 我们暂时禁用 625，再测试其他 patch。
      # ==========================================================

      - name: Disable PPP 625 for isolation test
        if: env.PPP_625_FAILED == 'true'
        working-directory: lede
        shell: bash
        run: |
          set -e

          PATCH="target/linux/generic/backport-6.18/625-v7.0-ppp-enable-TX-scatter-gather.patch"

          if [ ! -f "$PATCH" ]; then
            echo "ERROR: PPP patch not found:"
            echo "$PATCH"
            exit 1
          fi

          echo "=========================================="
          echo "Disable PPP 625"
          echo "=========================================="

          mv \
            "$PATCH" \
            "${PATCH}.disabled"

          echo
          echo "Disabled:"
          echo "${PATCH}.disabled"

      # ==========================================================
      # 17. 清理 kernel build directory
      # ==========================================================

      - name: Clean kernel build directory
        if: env.PPP_625_FAILED == 'true'
        working-directory: lede
        shell: bash
        run: |
          set -e

          rm -rf \
            build_dir/target-x86_64_musl/linux-x86_64

          echo "Kernel build directory cleaned."

      # ==========================================================
      # 18. 测试除 625 之外的所有 patch
      # ==========================================================

      - name: Test Linux 6.18 without PPP 625
        id: ppp_test
        if: env.PPP_625_FAILED == 'true'
        working-directory: lede
        shell: bash
        run: |
          set +e

          export TERM=xterm

          echo "=========================================="
          echo "测试 Linux 6.18"
          echo "排除 PPP 625"
          echo "=========================================="

          make target/linux/prepare V=s \
            2>&1 |
            tee kernel_prepare_without_625.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "Exit code: $STATUS"

          if [ "$STATUS" -eq 0 ]; then
            echo "PPP_625_ONLY=true" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "PPP_625_ONLY=false" >> "$GITHUB_ENV"

          echo
          echo "=========================================="
          echo "除 625 外还有其他 Patch 失败"
          echo "=========================================="

          exit "$STATUS"

      # ==========================================================
      # 19. PPP 测试结果
      # ==========================================================

      - name: PPP result
        id: ppp_result
        if: always()
        shell: bash
        run: |
          if [ "${PPP_625_ONLY:-false}" = "true" ]; then
            echo "ppp_ok=false" >> "$GITHUB_OUTPUT"

            echo
            echo "=========================================="
            echo "RESULT"
            echo "=========================================="
            echo "Linux 6.18 other patches: PASS"
            echo "PPP 625: FAIL"
            echo "=========================================="

          elif [ "${ALL_PATCH_OK:-false}" = "true" ]; then
            echo "ppp_ok=true" >> "$GITHUB_OUTPUT"

          else
            echo "ppp_ok=false" >> "$GITHUB_OUTPUT"
          fi

      # ==========================================================
      # 20. 上传失败文件
      # ==========================================================

      - name: Upload kernel test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-6.18-${{ steps.kernel.outputs.new_version }}-debug
          path: |
            lede/kernel_prepare_all.log
            lede/kernel_prepare_without_625.log

            lede/include/kernel-6.18
            lede/include/kernel-6.18.backup

            lede/target/linux/x86/Makefile

            lede/target/linux/generic/backport-6.18/625-v7.0-ppp-enable-TX-scatter-gather.patch
            lede/target/linux/generic/backport-6.18/625-v7.0-ppp-enable-TX-scatter-gather.patch.disabled

            lede/build_dir/**/*.rej

            lede/build_dir/**/drivers/net/ppp/ppp_generic.c

            lede/build_dir/**/drivers/net/ppp/ppp_generic.c.rej

          if-no-files-found: warn

      # ==========================================================
      # 21. 最终结果
      # ==========================================================

      - name: Final result
        id: result
        if: always()
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo "Linux 6.18 Checker Result"
          echo "=================================================="

          echo
          echo "Current:"
          echo "${{ steps.current.outputs.current }}"

          echo
          echo "Latest:"
          echo "${{ steps.kernel.outputs.new_version }}"

          echo

          if [ "${ALL_PATCH_OK:-false}" = "true" ]; then

            echo "=========================================="
            echo "PASS"
            echo "=========================================="
            echo
            echo "All Linux 6.18 patches passed."

            echo "kernel_ok=true" >> "$GITHUB_OUTPUT"

            exit 0

          elif [ "${PPP_625_ONLY:-false}" = "true" ]; then

            echo "=========================================="
            echo "PARTIAL PASS"
            echo "=========================================="
            echo
            echo "All patches except PPP 625 passed."
            echo
            echo "Failed patch:"
            echo "625-v7.0-ppp-enable-TX-scatter-gather.patch"
            echo
            echo "This means the 625 patch needs to be"
            echo "rebased for this Linux 6.18.x version."

            echo "kernel_ok=false" >> "$GITHUB_OUTPUT"

            exit 1

          else

            echo "=========================================="
            echo "FAIL"
            echo "=========================================="
            echo
            echo "Linux 6.18 patch compatibility failed."

            echo "kernel_ok=false" >> "$GITHUB_OUTPUT"

            exit 1

          fi
