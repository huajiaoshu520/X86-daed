name: LEDE Kernel 6.18 Checker
on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 00:00 = 北京时间 08:00
    - cron: "0 0 * * *"
permissions:
  contents: read
env:
  LEDE_REPO: https://github.com/coolsnowwolf/lede
  LEDE_BRANCH: master
jobs:
  # ============================================================
  # Kernel 6.18 compatibility check
  # ============================================================
  kernel-check:
    runs-on: ubuntu-24.04
    outputs:
      kernel_ok: ${{ steps.result.outputs.kernel_ok }}
      current_kernel: ${{ steps.current.outputs.current }}
      latest_kernel: ${{ steps.kernel.outputs.new_version }}
    steps:
      # ==========================================================
      # 1. 安装依赖
      # ==========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-venv \
            rsync \
            unzip \
            wget \
            quilt \
            zstd \
            file \
            curl \
            bc \
            cpio \
            kmod \
            libelf-dev \
            patch \
            tar \
            xz-utils
      # ==========================================================
      # 2. Clone LEDE
      # ==========================================================
      - name: Clone LEDE
        shell: bash
        run: |
          set -e
          git clone \
            --depth=1 \
            --branch "$LEDE_BRANCH" \
            "$LEDE_REPO" \
            lede
      # ==========================================================
      # 3. 显示 LEDE commit
      # ==========================================================
      - name: Show LEDE information
        working-directory: lede
        shell: bash
        run: |
          set -e
          echo "=========================================="
          echo "LEDE information"
          echo "=========================================="
          echo "Repository:"
          echo "$LEDE_REPO"
          echo
          echo "Branch:"
          echo "$LEDE_BRANCH"
          echo
          echo "Commit:"
          git rev-parse HEAD
          echo
          echo "Commit message:"
          git log -1 --oneline
      # ==========================================================
      # 4. 检查 x86 kernel 定义
      # ==========================================================
      - name: Detect x86 kernel configuration
        id: detect
        working-directory: lede
        shell: bash
        run: |
          set -e
          FILE="target/linux/x86/Makefile"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi
          STABLE=$(
            sed -n \
              's/^KERNEL_PATCHVER[[:space:]]*:=\(.*\)$/\1/p' \
              "$FILE" |
            head -1 |
            tr -d '[:space:]'
          )
          TESTING=$(
            sed -n \
              's/^KERNEL_TESTING_PATCHVER[[:space:]]*:=\(.*\)$/\1/p' \
              "$FILE" |
            head -1 |
            tr -d '[:space:]'
          )
          echo "=========================================="
          echo "x86 kernel configuration"
          echo "=========================================="
          echo "Stable kernel : $STABLE"
          echo "Testing kernel: $TESTING"
          if [ -z "$STABLE" ]; then
            echo "ERROR: KERNEL_PATCHVER not found"
            exit 1
          fi
          if [ -z "$TESTING" ]; then
            echo "ERROR: KERNEL_TESTING_PATCHVER not found"
            exit 1
          fi
          if [ "$TESTING" != "6.18" ]; then
            echo
            echo "ERROR:"
            echo "This workflow is designed for Linux 6.18."
            echo "Current testing kernel is: $TESTING"
            exit 1
          fi
          echo
          echo "OK: LEDE x86 testing kernel is 6.18."
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "testing=$TESTING" >> "$GITHUB_OUTPUT"
      # ==========================================================
      # 5. 找到 include/kernel-6.18
      # ==========================================================
      - name: Locate kernel-6.18
        id: kernel_file
        working-directory: lede
        shell: bash
        run: |
          set -e
          FILE="include/kernel-6.18"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            echo
            echo "Available kernel files:"
            find include \
              -maxdepth 1 \
              -type f \
              -name 'kernel-*' \
              -print |
            sort -V
            exit 1
          fi
          echo "Kernel file:"
          echo "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
      # ==========================================================
      # 6. 读取当前 Linux 6.18 版本
      # ==========================================================
      - name: Detect current Linux 6.18 version
        id: current
        working-directory: lede
        shell: bash
        run: |
          set -e
          FILE="include/kernel-6.18"
          CURRENT=$(
            grep '^LINUX_KERNEL_HASH-' "$FILE" |
            sed -n \
              's/^LINUX_KERNEL_HASH-\([^[:space:]]*\)[[:space:]]*=.*/\1/p' |
            sort -V |
            tail -1
          )
          if [ -z "$CURRENT" ]; then
            echo "ERROR: Cannot detect current Linux 6.18 version"
            cat "$FILE"
            exit 1
          fi
          echo "=========================================="
          echo "Current Linux 6.18:"
          echo "$CURRENT"
          echo "=========================================="
          case "$CURRENT" in
            6.18.*)
              ;;
            *)
              echo "ERROR: Current version is not Linux 6.18.x"
              exit 1
              ;;
          esac
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
      # ==========================================================
      # 7. 获取 kernel.org 最新 6.18.x
      # ==========================================================
      - name: Get latest Linux 6.18
        id: kernel
        shell: bash
        run: |
          set -e
          echo "Checking kernel.org..."
          PAGE=$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              https://www.kernel.org/pub/linux/kernel/v6.x/
          )
          LATEST=$(
            printf '%s\n' "$PAGE" |
            grep -oE \
              'linux-6\.18\.[0-9]+\.tar\.xz' |
            sed 's/^linux-//' |
            sed 's/\.tar\.xz$//' |
            sort -V |
            tail -1
          )
          if [ -z "$LATEST" ]; then
            echo "ERROR: Cannot find latest Linux 6.18.x"
            exit 1
          fi
          echo "=========================================="
          echo "Latest Linux 6.18:"
          echo "$LATEST"
          echo "=========================================="
          echo "new_version=$LATEST" >> "$GITHUB_OUTPUT"
      # ==========================================================
      # 8. 判断是否需要升级
      # ==========================================================
      - name: Compare Linux versions
        id: compare
        shell: bash
        run: |
          set -e
          CURRENT="${{ steps.current.outputs.current }}"
          LATEST="${{ steps.kernel.outputs.new_version }}"
          echo "Current: $CURRENT"
          echo "Latest : $LATEST"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo
            echo "Linux 6.18 is already up to date."
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo
            echo "Linux 6.18 update detected."
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi
      # ==========================================================
      # 9. 下载最新 kernel
      # ==========================================================
      - name: Download Linux 6.18
        if: steps.compare.outputs.update == 'true'
        shell: bash
        run: |
          set -e
          VERSION="${{ steps.kernel.outputs.new_version }}"
          URL="https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${VERSION}.tar.xz"
          echo "Downloading:"
          echo "$URL"
          wget \
            --progress=dot:giga \
            "$URL"
          test -f "linux-${VERSION}.tar.xz"
      # ==========================================================
      # 10. SHA256
      # ==========================================================
      - name: Calculate SHA256
        if: steps.compare.outputs.update == 'true'
        id: hash
        shell: bash
        run: |
          set -e
          VERSION="${{ steps.kernel.outputs.new_version }}"
          HASH=$(
            sha256sum \
              "linux-${VERSION}.tar.xz" |
            awk '{print $1}'
          )
          echo "=========================================="
          echo "Linux:"
          echo "$VERSION"
          echo
          echo "SHA256:"
          echo "$HASH"
          echo "=========================================="
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
      # ==========================================================
      # 11. 更新 include/kernel-6.18
      # ==========================================================
      - name: Update Linux 6.18 hash
        if: steps.compare.outputs.update == 'true'
        working-directory: lede
        shell: bash
        run: |
          set -e
          FILE="include/kernel-6.18"
          CURRENT="${{ steps.current.outputs.current }}"
          NEW="${{ steps.kernel.outputs.new_version }}"
          HASH="${{ steps.hash.outputs.hash }}"
          echo "=========================================="
          echo "Updating Linux 6.18"
          echo "=========================================="
          echo "$CURRENT -> $NEW"
          cp "$FILE" "${FILE}.backup"
          python3 <<PY
          from pathlib import Path
          import re
          path = Path("include/kernel-6.18")
          text = path.read_text()
          current = "$CURRENT"
          new = "$NEW"
          sha256 = "$HASH"
          match = re.fullmatch(
              r"6\.18\.(\d+)",
              new
          )
          if not match:
              raise SystemExit(
                  f"Invalid Linux 6.18 version: {new}"
              )
          patch_version = match.group(1)
          # ----------------------------------------------------
          # 更新 LINUX_VERSION-6.18
          # ----------------------------------------------------
          text, count = re.subn(
              r"^LINUX_VERSION-6\.18\s*=.*$",
              f"LINUX_VERSION-6.18 = .{patch_version}",
              text,
              flags=re.MULTILINE
          )
          if count != 1:
              raise SystemExit(
                  "Failed to update LINUX_VERSION-6.18"
              )
          # ----------------------------------------------------
          # 删除旧 hash
          # ----------------------------------------------------
          text, count = re.subn(
              r"^LINUX_KERNEL_HASH-"
              + re.escape(current)
              + r"\s*=.*$\n?",
              "",
              text,
              flags=re.MULTILINE
          )
          if count != 1:
              raise SystemExit(
                  f"Failed to remove old hash: {current}"
              )
          # ----------------------------------------------------
          # 删除可能存在的同版本 hash
          # ----------------------------------------------------
          text = re.sub(
              r"^LINUX_KERNEL_HASH-"
              + re.escape(new)
              + r"\s*=.*$\n?",
              "",
              text,
              flags=re.MULTILINE
          )
          # ----------------------------------------------------
          # 添加新 hash
          # ----------------------------------------------------
          if not text.endswith("\n"):
              text += "\n"
          text += (
              f"LINUX_KERNEL_HASH-{new} = {sha256}\n"
          )
          path.write_text(text)
          PY
          echo
          echo "=========================================="
          echo "Updated include/kernel-6.18"
          echo "=========================================="
          cat "$FILE"
      # ==========================================================
      # 12. 强制把 x86 默认 kernel 改成 6.18
      #
      # 关键：
      #
      # 原始：
      # KERNEL_PATCHVER:=6.12
      # KERNEL_TESTING_PATCHVER:=6.18
      #
      # 本次临时测试：
      # KERNEL_PATCHVER:=6.18
      #
      # 这样 make target/linux/prepare 必然使用 6.18。
      # ==========================================================
      - name: Force x86 Linux 6.18
        working-directory: lede
        shell: bash
        run: |
          set -e
          FILE="target/linux/x86/Makefile"
          echo "=========================================="
          echo "x86 Makefile BEFORE"
          echo "=========================================="
          grep -E \
            'KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER' \
            "$FILE"
          echo
          echo "Forcing KERNEL_PATCHVER to 6.18..."
          sed -i \
            's/^KERNEL_PATCHVER:=6\.12$/KERNEL_PATCHVER:=6.18/' \
            "$FILE"
          echo
          echo "=========================================="
          echo "x86 Makefile AFTER"
          echo "=========================================="
          grep -E \
            'KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER' \
            "$FILE"
          if ! grep -q \
            '^KERNEL_PATCHVER:=6\.18$' \
            "$FILE"; then
            echo
            echo "ERROR: Failed to force Linux 6.18"
            exit 1
          fi
          echo
          echo "OK: x86 is configured for Linux 6.18."
      # ==========================================================
      # 13. 配置 x86_64
      # ==========================================================
      - name: Configure x86_64
        working-directory: lede
        shell: bash
        run: |
          set -e
          export TERM=xterm
          echo "=========================================="
          echo "Configure x86_64"
          echo "=========================================="
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          EOF
          make defconfig
      # ==========================================================
      # 14. 强制确认 Linux 版本
      # ==========================================================
      - name: 强制确认 Linux 版本
        working-directory: lede
        shell: bash
        run: |
          set -e
          echo
          echo "=================================================="
          echo "===== 强制确认 Linux 版本 ====="
          echo "=================================================="
          echo
          echo "===== x86 Makefile ====="
          grep -E \
            'KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER' \
            target/linux/x86/Makefile || true
          echo
          echo "===== kernel-6.18 ====="
          cat include/kernel-6.18
          echo
          echo "===== .config ====="
          grep -E \
            'CONFIG_TARGET_x86|CONFIG_KERNEL|TESTING' \
            .config || true
          echo
          echo "===== target Makefile ====="
          grep -R \
            'KERNEL_PATCHVER' \
            target/linux/x86 \
            include \
            -n || true
          echo
          echo "===== LEDE commit ====="
          git rev-parse HEAD
          echo
          echo "=================================================="
          echo "===== 版本确认结束 ====="
          echo "=================================================="
      # ==========================================================
      # 15. 检查 build_dir，绝对禁止使用 6.12
      # ==========================================================
      - name: Verify build kernel version
        working-directory: lede
        shell: bash
        run: |
          set -e
          EXPECTED="${{ steps.kernel.outputs.new_version }}"
          echo "=========================================="
          echo "Expected kernel: $EXPECTED"
          echo "=========================================="
          echo
          echo "Checking kernel include..."
          grep \
            "LINUX_KERNEL_HASH-${EXPECTED}" \
            include/kernel-6.18
          echo
          echo "Checking x86 Makefile..."
          grep \
            '^KERNEL_PATCHVER:=6\.18$' \
            target/linux/x86/Makefile
          echo
          echo "Checking build_dir..."
          find build_dir \
            -maxdepth 6 \
            -type d \
            -name 'linux-*' \
            -print \
            2>/dev/null || true
          echo
          echo "Checking for Linux 6.12 build directory..."
          OLD_DIRS=$(
            find build_dir \
              -maxdepth 6 \
              -type d \
              -name 'linux-6.12*' \
              -print \
              2>/dev/null || true
          )
          if [ -n "$OLD_DIRS" ]; then
            echo
            echo "ERROR: Linux 6.12 build directory detected:"
            echo "$OLD_DIRS"
            exit 1
          fi
          echo
          echo "OK: No Linux 6.12 build directory."
      # ==========================================================
      # 16. 开始测试 Linux Kernel Patch
      # ==========================================================
      - name: 开始测试 Linux Kernel Patch
        working-directory: lede
        shell: bash
        run: |
          set -o pipefail
          export TERM=xterm
          echo
          echo "======================================"
          echo "开始测试 Linux Kernel Patch"
          echo "======================================"
          echo
          echo "Expected kernel:"
          echo "${{ steps.kernel.outputs.new_version }}"
          echo
          echo "x86 kernel:"
          grep \
            '^KERNEL_PATCHVER' \
            target/linux/x86/Makefile
          echo
          make target/linux/prepare V=s \
            2>&1 |
            tee kernel_prepare.log
      # ==========================================================
      # 17. 测试结果
      # ==========================================================
      - name: Kernel test PASSED
        id: result
        if: success()
        shell: bash
        run: |
          echo
          echo "======================================"
          echo "Linux Kernel Patch TEST PASSED"
          echo "======================================"
          echo
          echo "Kernel:"
          echo "${{ steps.kernel.outputs.new_version }}"
          echo
          echo "6.18 patch compatibility test passed."
          echo "kernel_ok=true" >> "$GITHUB_OUTPUT"
      # ==========================================================
      # 18. 上传失败日志
      # ==========================================================
      - name: Upload kernel failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-6.18-check-failure
          path: |
            lede/kernel_prepare.log
            lede/include/kernel-6.18
            lede/include/kernel-6.18.backup
            lede/target/linux/x86/Makefile
            lede/build_dir/**/*.rej
            lede/build_dir/**/linux-*/.config
          if-no-files-found: ignore
  # ============================================================
  # 第二阶段
  #
  # 只有 6.18 patch 全部通过，才触发 X86.yml
  # ============================================================
  trigger-build:
    needs: kernel-check
    if: >
      needs.kernel-check.result == 'success' &&
      needs.kernel-check.outputs.kernel_ok == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger X86 build
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: OpenWrt相关代码更新
          token: ${{ secrets.GITHUB_TOKEN }}
          client-payload: |
            {
              "kernel_check": "passed",
              "kernel_version": "${{ needs.kernel-check.outputs.kernel_version }}"
            }
      - name: Build trigger result
        shell: bash
        run: |
          echo
          echo "======================================"
          echo "Kernel compatibility check PASSED"
          echo "======================================"
          echo
          echo "Linux kernel:"
          echo "${{ needs.kernel-check.outputs.kernel_version }}"
          echo
          echo "X86.yml has been triggered."
