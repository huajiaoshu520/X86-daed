```yaml
name: LEDE Linux 6.18 Kernel Checker

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

env:
  LEDE_REPO: https://github.com/coolsnowwolf/lede
  LEDE_BRANCH: master

jobs:

  # ============================================================
  # Linux 6.18 Kernel Checker
  # ============================================================

  kernel-check:

    runs-on: ubuntu-24.04

    outputs:
      kernel_version: ${{ steps.kernel.outputs.new_version }}
      current_kernel: ${{ steps.current.outputs.current }}
      kernel_ok: ${{ steps.result.outputs.kernel_ok }}
      ppp_ok: ${{ steps.ppp_result.outputs.ppp_ok }}

    steps:

      # ==========================================================
      # 1. 安装依赖
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-venv \
            rsync \
            unzip \
            wget \
            quilt \
            zstd \
            file \
            curl \
            bc \
            cpio \
            kmod \
            libelf-dev \
            patch \
            tar \
            xz-utils

      # ==========================================================
      # 2. Clone LEDE
      # ==========================================================

      - name: Clone LEDE
        shell: bash
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch "$LEDE_BRANCH" \
            "$LEDE_REPO" \
            lede

      # ==========================================================
      # 3. 显示 LEDE 信息
      # ==========================================================

      - name: Show LEDE information
        working-directory: lede
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "LEDE information"
          echo "=========================================="

          echo
          echo "Repository:"
          echo "$LEDE_REPO"

          echo
          echo "Branch:"
          echo "$LEDE_BRANCH"

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Commit message:"
          git log -1 --oneline

      # ==========================================================
      # 4. 检查 x86 Makefile
      # ==========================================================

      - name: Check x86 kernel configuration
        working-directory: lede
        shell: bash
        run: |
          set -e

          FILE="target/linux/x86/Makefile"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi

          echo "=========================================="
          echo "Original x86 kernel configuration"
          echo "=========================================="

          grep -E \
            'KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER' \
            "$FILE" || true

      # ==========================================================
      # 5. 找到 kernel-6.18
      # ==========================================================

      - name: Locate kernel-6.18
        working-directory: lede
        shell: bash
        run: |
          set -e

          FILE="include/kernel-6.18"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"

            echo
            echo "Repository tree:"
            find include \
              -maxdepth 1 \
              -type f \
              -name 'kernel-*' \
              -print |
            sort -V

            exit 1
          fi

          echo "Using:"
          echo "$FILE"

      # ==========================================================
      # 6. 检测当前 Linux 6.18 版本
      # ==========================================================

      - name: Detect current Linux 6.18
        id: current
        working-directory: lede
        shell: bash
        run: |
          set -e

          FILE="include/kernel-6.18"

          CURRENT=$(
            grep '^LINUX_KERNEL_HASH-' "$FILE" |
            sed \
              -n \
              's/^LINUX_KERNEL_HASH-\([^[:space:]]*\)[[:space:]]*=.*/\1/p' |
            sort -V |
            tail -1
          )

          if [ -z "$CURRENT" ]; then
            echo "ERROR: Cannot detect Linux 6.18 version"
            cat "$FILE"
            exit 1
          fi

          echo
          echo "Current Linux 6.18:"
          echo "$CURRENT"

          case "$CURRENT" in
            6.18.*)
              ;;
            *)
              echo "ERROR: $CURRENT is not Linux 6.18.x"
              exit 1
              ;;
          esac

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 7. 获取 kernel.org 最新 6.18.x
      # ==========================================================

      - name: Get latest Linux 6.18
        id: kernel
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Checking kernel.org"
          echo "=========================================="

          PAGE=$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              https://www.kernel.org/pub/linux/kernel/v6.x/
          )

          LATEST=$(
            printf '%s\n' "$PAGE" |
            grep -oE \
              'linux-6\.18\.[0-9]+\.tar\.xz' |
            sed 's/^linux-//' |
            sed 's/\.tar\.xz$//' |
            sort -V |
            tail -1
          )

          if [ -z "$LATEST" ]; then
            echo "ERROR: Cannot find latest Linux 6.18.x"
            exit 1
          fi

          echo
          echo "Latest Linux 6.18:"
          echo "$LATEST"

          echo "new_version=$LATEST" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 8. 比较版本
      # ==========================================================

      - name: Compare Linux versions
        id: compare
        shell: bash
        run: |
          set -e

          CURRENT="${{ steps.current.outputs.current }}"
          LATEST="${{ steps.kernel.outputs.new_version }}"

          echo "Current: $CURRENT"
          echo "Latest : $LATEST"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo
            echo "Linux 6.18 is already up to date."

            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo
            echo "Linux 6.18 update detected."

            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      # ==========================================================
      # 9. 下载最新 Linux
      # ==========================================================

      - name: Download Linux 6.18
        if: steps.compare.outputs.update == 'true'
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.kernel.outputs.new_version }}"

          URL="https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${VERSION}.tar.xz"

          echo "Downloading:"
          echo "$URL"

          mkdir -p lede/dl

          wget \
            --progress=dot:giga \
            "$URL" \
            -O "lede/dl/linux-${VERSION}.tar.xz"

          test -f "lede/dl/linux-${VERSION}.tar.xz"

      # ==========================================================
      # 10. 计算 SHA256
      # ==========================================================

      - name: Calculate SHA256
        if: steps.compare.outputs.update == 'true'
        id: hash
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.kernel.outputs.new_version }}"

          HASH=$(
            sha256sum \
              "lede/dl/linux-${VERSION}.tar.xz" |
            awk '{print $1}'
          )

          echo "=========================================="
          echo "Linux:"
          echo "$VERSION"
          echo
          echo "SHA256:"
          echo "$HASH"
          echo "=========================================="

          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 11. 更新 include/kernel-6.18
      # ==========================================================

      - name: Update kernel-6.18
        if: steps.compare.outputs.update == 'true'
        working-directory: lede
        shell: bash
        run: |
          set -e

          FILE="include/kernel-6.18"

          CURRENT="${{ steps.current.outputs.current }}"
          NEW="${{ steps.kernel.outputs.new_version }}"
          HASH="${{ steps.hash.outputs.hash }}"

          echo "=========================================="
          echo "Updating kernel-6.18"
          echo "=========================================="

          echo
          echo "Old:"
          echo "$CURRENT"

          echo
          echo "New:"
          echo "$NEW"

          cp "$FILE" "${FILE}.backup"

          python3 <<PY

          from pathlib import Path
          import re

          path = Path("include/kernel-6.18")

          text = path.read_text()

          current = "$CURRENT"
          new = "$NEW"
          sha256 = "$HASH"

          match = re.fullmatch(
              r"6\.18\.(\d+)",
              new
          )

          if not match:
              raise SystemExit(
                  f"Invalid Linux 6.18 version: {new}"
              )

          patch_version = match.group(1)

          # ----------------------------------------------------
          # 更新 LINUX_VERSION-6.18
          # ----------------------------------------------------

          text, count = re.subn(
              r"^LINUX_VERSION-6\.18\s*=.*$",
              f"LINUX_VERSION-6.18 = .{patch_version}",
              text,
              flags=re.MULTILINE
          )

          if count != 1:
              raise SystemExit(
                  "Failed to update LINUX_VERSION-6.18"
              )

          # ----------------------------------------------------
          # 删除旧 hash
          # ----------------------------------------------------

          text = re.sub(
              r"^LINUX_KERNEL_HASH-"
              + re.escape(current)
              + r"\s*=.*$\n?",
              "",
              text,
              flags=re.MULTILINE
          )

          # ----------------------------------------------------
          # 删除可能存在的新 hash
          # ----------------------------------------------------

          text = re.sub(
              r"^LINUX_KERNEL_HASH-"
              + re.escape(new)
              + r"\s*=.*$\n?",
              "",
              text,
              flags=re.MULTILINE
          )

          # ----------------------------------------------------
          # 添加新 hash
          # ----------------------------------------------------

          if not text.endswith("\n"):
              text += "\n"

          text += (
              f"LINUX_KERNEL_HASH-{new} = {sha256}\n"
          )

          path.write_text(text)

          PY

          echo
          echo "=========================================="
          echo "Updated kernel-6.18"
          echo "=========================================="

          cat "$FILE"

      # ==========================================================
      # 12. 强制 x86 使用 Linux 6.18
      # ==========================================================

      - name: Force x86 Linux 6.18
        working-directory: lede
        shell: bash
        run: |
          set -e

          FILE="target/linux/x86/Makefile"

          echo "=========================================="
          echo "x86 Makefile BEFORE"
          echo "=========================================="

          grep -E \
            'KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER' \
            "$FILE" || true

          echo
          echo "Force KERNEL_PATCHVER=6.18"

          sed -i \
            's/^KERNEL_PATCHVER:=6\.12$/KERNEL_PATCHVER:=6.18/' \
            "$FILE"

          echo
          echo "=========================================="
          echo "x86 Makefile AFTER"
          echo "=========================================="

          grep -E \
            'KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER' \
            "$FILE"

          if ! grep -q \
            '^KERNEL_PATCHVER:=6\.18$' \
            "$FILE"; then

            echo
            echo "ERROR: Failed to force Linux 6.18"
            exit 1
          fi

          echo
          echo "OK: x86 Kernel = 6.18"

      # ==========================================================
      # 13. 配置 x86_64
      # ==========================================================

      - name: Configure x86_64
        working-directory: lede
        shell: bash
        run: |
          set -e

          export TERM=xterm

          echo "=========================================="
          echo "Configure x86_64"
          echo "=========================================="

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          EOF

          make defconfig

      # ==========================================================
      # 14. 最终确认版本
      # ==========================================================

      - name: Verify Linux 6.18 configuration
        working-directory: lede
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL KERNEL CONFIGURATION"
          echo "=========================================="

          echo
          echo "===== x86 Makefile ====="

          grep -E \
            'KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER' \
            target/linux/x86/Makefile

          echo
          echo "===== kernel-6.18 ====="

          cat include/kernel-6.18

          echo
          echo "===== .config ====="

          grep -E \
            'CONFIG_TARGET_x86|CONFIG_KERNEL|TESTING' \
            .config || true

          echo
          echo "===== target Makefile ====="

          grep -R \
            'KERNEL_PATCHVER' \
            target/linux/x86 \
            include \
            -n || true

          echo
          echo "=========================================="

          if ! grep -q \
            '^KERNEL_PATCHVER:=6\.18$' \
            target/linux/x86/Makefile; then

            echo "ERROR: x86 is NOT using Linux 6.18"
            exit 1
          fi

          echo
          echo "OK: x86 is using Linux 6.18."

      # ==========================================================
      # 15. 第一次测试：全部 patch
      # ==========================================================

      - name: Test all Linux 6.18 patches
        id: all_test
        working-directory: lede
        shell: bash
        run: |
          set +e

          export TERM=xterm

          echo "======================================"
          echo "开始测试全部 Linux Kernel Patch"
          echo "======================================"

          echo
          echo "Kernel:"
          echo "${{ steps.kernel.outputs.new_version }}"

          echo
          echo "======================================"

          make target/linux/prepare V=s \
            2>&1 |
            tee kernel_prepare_all.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "make exit code: $STATUS"

          if [ "$STATUS" -eq 0 ]; then

            echo
            echo "======================================"
            echo "ALL PATCHES PASSED"
            echo "======================================"

            echo "ALL_PATCH_OK=true" >> "$GITHUB_ENV"

            exit 0
          fi

          echo
          echo "ALL_PATCH_OK=false" >> "$GITHUB_ENV"

          echo
          echo "======================================"
          echo "Kernel patch test failed."
          echo "======================================"

          # ------------------------------------------------------
          # 判断是不是 PPP 625
          # ------------------------------------------------------

          if grep -q \
            '625-v7.0-ppp-enable-TX-scatter-gather.patch' \
            kernel_prepare_all.log; then

            echo
            echo "Detected PPP 625 patch failure."

            echo "PPP_625_FAILED=true" >> "$GITHUB_ENV"

            # 这里故意不 exit 1
            # 后面继续做隔离测试

            exit 0
          fi

          echo
          echo "ERROR: Failure is NOT PPP 625."

          echo "OTHER_PATCH_FAILED=true" >> "$GITHUB_ENV"

          exit "$STATUS"

      # ==========================================================
      # 16. 上传第一次测试日志
      # ==========================================================

      - name: Upload first kernel test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-6.18-${{ steps.kernel.outputs.new_version }}-first-test
          path: |
            lede/kernel_prepare_all.log
            lede/include/kernel-6.18
            lede/include/kernel-6.18.backup
            lede/target/linux/x86/Makefile
            lede/build_dir/**/*.rej
          if-no-files-found: warn

      # ==========================================================
      # 17. 把 625 移出 patch 扫描目录
      #
      # 重要：
      #
      # 不能改成：
      #
      # 625.patch.disabled
      #
      # 因为 LEDE 的 patch 扫描器仍可能匹配 *.patch*
      #
      # 所以直接移到：
      #
      # target/linux/generic/
      #
      # ==========================================================

      - name: Disable PPP 625 for isolation test
        if: env.PPP_625_FAILED == 'true'
        working-directory: lede
        shell: bash
        run: |
          set -e

          PATCH="target/linux/generic/backport-6.18/625-v7.0-ppp-enable-TX-scatter-gather.patch"

          BACKUP="target/linux/generic/625-v7.0-ppp-enable-TX-scatter-gather.patch.disabled"

          echo "=========================================="
          echo "Disable PPP 625"
          echo "=========================================="

          if [ ! -f "$PATCH" ]; then
            echo
            echo "ERROR: PPP 625 patch not found:"
            echo "$PATCH"
            exit 1
          fi

          # 确保旧备份不存在
          rm -f "$BACKUP"

          # ----------------------------------------------------
          # 移出 backport-6.18
          # ----------------------------------------------------

          mv \
            "$PATCH" \
            "$BACKUP"

          echo
          echo "Original:"
          echo "$PATCH"

          echo
          echo "Moved to:"
          echo "$BACKUP"

          # ----------------------------------------------------
          # 确认 backport-6.18 已经没有 625
          # ----------------------------------------------------

          echo
          echo "Checking backport directory..."

          if find \
            target/linux/generic/backport-6.18 \
            -maxdepth 1 \
            -type f \
            -name '*625*' |
            grep -q .; then

            echo
            echo "ERROR: 625 still exists in backport-6.18"

            find \
              target/linux/generic/backport-6.18 \
              -maxdepth 1 \
              -type f \
              -name '*625*'

            exit 1
          fi

          echo
          echo "OK: 625 is outside backport-6.18."

          echo
          echo "Remaining patch:"
          find \
            target/linux/generic/backport-6.18 \
            -maxdepth 1 \
            -type f \
            -name '*.patch' |
            sort -V |
            tail -20

      # ==========================================================
      # 18. 清理 Linux build directory
      # ==========================================================

      - name: Clean kernel build directory
        if: env.PPP_625_FAILED == 'true'
        working-directory: lede
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Clean Linux kernel build directory"
          echo "=========================================="

          rm -rf \
            build_dir/target-x86_64_musl/linux-x86_64

          echo
          echo "Build directory cleaned."

      # ==========================================================
      # 19. 第二次测试
      #
      # 这里应该完全看不到：
      #
      # 625-v7.0-ppp-enable-TX-scatter-gather.patch
      #
      # ==========================================================

      - name: Test Linux 6.18 without PPP 625
        id: ppp_test
        if: env.PPP_625_FAILED == 'true'
        working-directory: lede
        shell: bash
        run: |
          set +e

          export TERM=xterm

          echo "======================================"
          echo "第二次测试 Linux 6.18"
          echo "======================================"

          echo
          echo "PPP 625 has been removed from:"
          echo "target/linux/generic/backport-6.18"

          echo
          echo "Checking for 625..."

          if find \
            target/linux/generic/backport-6.18 \
            -maxdepth 1 \
            -type f \
            -name '*625*' |
            grep -q .; then

            echo
            echo "ERROR: 625 still exists!"
            exit 1
          fi

          echo
          echo "OK: 625 is not present."

          echo
          echo "======================================"
          echo "Applying remaining Linux 6.18 patches"
          echo "======================================"

          make target/linux/prepare V=s \
            2>&1 |
            tee kernel_prepare_without_625.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "make exit code: $STATUS"

          if [ "$STATUS" -eq 0 ]; then

            echo
            echo "======================================"
            echo "ALL OTHER PATCHES PASSED"
            echo "======================================"

            echo "PPP_625_ONLY=true" >> "$GITHUB_ENV"

            exit 0
          fi

          echo
          echo "======================================"
          echo "OTHER PATCHES ALSO FAILED"
          echo "======================================"

          echo "PPP_625_ONLY=false" >> "$GITHUB_ENV"

          exit "$STATUS"

      # ==========================================================
      # 20. 检查第二次测试是否真的没有 625
      # ==========================================================

      - name: Verify PPP 625 isolation
        if: env.PPP_625_FAILED == 'true'
        working-directory: lede
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Verify PPP 625 isolation"
          echo "=========================================="

          echo
          echo "Searching logs for 625..."

          if [ -f kernel_prepare_without_625.log ]; then

            if grep -q \
              '625-v7.0-ppp-enable-TX-scatter-gather.patch' \
              kernel_prepare_without_625.log; then

              echo
              echo "ERROR:"
              echo "625 still appeared in second test!"

              grep \
                -n \
                '625-v7.0-ppp-enable-TX-scatter-gather.patch' \
                kernel_prepare_without_625.log

              exit 1
            fi

          fi

          echo
          echo "OK:"
          echo "Second test did not apply PPP 625."

      # ==========================================================
      # 21. PPP 测试结果
      # ==========================================================

      - name: PPP result
        id: ppp_result
        if: always()
        shell: bash
        run: |
          if [ "${PPP_625_ONLY:-false}" = "true" ]; then

            echo "ppp_ok=false" >> "$GITHUB_OUTPUT"

            echo
            echo "=========================================="
            echo "RESULT"
            echo "=========================================="

            echo "Linux 6.18 other patches: PASS"
            echo "PPP 625: FAIL"

            echo
            echo "Only PPP 625 is incompatible."

          elif [ "${ALL_PATCH_OK:-false}" = "true" ]; then

            echo "ppp_ok=true" >> "$GITHUB_OUTPUT"

          else

            echo "ppp_ok=false" >> "$GITHUB_OUTPUT"

          fi

      # ==========================================================
      # 22. 上传完整调试文件
      # ==========================================================

      - name: Upload kernel debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-6.18-${{ steps.kernel.outputs.new_version }}-debug
          path: |
            lede/kernel_prepare_all.log
            lede/kernel_prepare_without_625.log

            lede/include/kernel-6.18
            lede/include/kernel-6.18.backup

            lede/target/linux/x86/Makefile

            lede/target/linux/generic/625-v7.0-ppp-enable-TX-scatter-gather.patch.disabled

            lede/target/linux/generic/backport-6.18/625-v7.0-ppp-enable-TX-scatter-gather.patch

            lede/build_dir/**/*.rej

            lede/build_dir/**/drivers/net/ppp/ppp_generic.c

            lede/build_dir/**/drivers/net/ppp/ppp_generic.c.rej

          if-no-files-found: warn

      # ==========================================================
      # 23. 最终结果
      # ==========================================================

      - name: Final result
        id: result
        if: always()
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo "Linux 6.18 Checker Result"
          echo "=================================================="

          echo
          echo "Current:"
          echo "${{ steps.current.outputs.current }}"

          echo
          echo "Latest:"
          echo "${{ steps.kernel.outputs.new_version }}"

          echo

          # ------------------------------------------------------
          # 全部通过
          # ------------------------------------------------------

          if [ "${ALL_PATCH_OK:-false}" = "true" ]; then

            echo "=========================================="
            echo "PASS"
            echo "=========================================="

            echo
            echo "All Linux 6.18 patches passed."

            echo "kernel_ok=true" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          # ------------------------------------------------------
          # 只有 PPP 625 失败
          # ------------------------------------------------------

          if [ "${PPP_625_ONLY:-false}" = "true" ]; then

            echo "=========================================="
            echo "PARTIAL PASS"
            echo "=========================================="

            echo
            echo "All Linux 6.18 patches except PPP 625 passed."

            echo
            echo "Failed patch:"
            echo "625-v7.0-ppp-enable-TX-scatter-gather.patch"

            echo
            echo "The PPP patch needs to be rebased."

            echo "kernel_ok=false" >> "$GITHUB_OUTPUT"

            exit 1

          fi

          # ------------------------------------------------------
          # 其他 patch 失败
          # ------------------------------------------------------

          echo "=========================================="
          echo "FAIL"
          echo "=========================================="

          echo
          echo "Linux 6.18 patch compatibility test failed."

          echo "kernel_ok=false" >> "$GITHUB_OUTPUT"

          exit 1
```
