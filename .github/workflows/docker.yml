name: docker auto update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            curl \
            jq \
            zstd \
            file

      # ==========================================================
      # Docker 自动检测 / 更新
      #
      # 29.1.1 永远作为固定基准
      #
      # Docker Engine:
      #   Moby tag
      #   ↓
      #   peeled commit
      #   ↓
      #   tar.gz SHA256
      #
      # Docker CLI:
      #   CLI tag
      #   ↓
      #   peeled commit
      #   ↓
      #   tar.gz SHA256
      # ==========================================================
      - name: Check and update Docker version
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION="29.1.1"
          SCRIPT="diy_script/diy-docker.sh"

          echo "========================================"
          echo "Docker automatic version detection"
          echo "Fixed base version: ${BASE_VERSION}"
          echo "========================================"

          if [[ ! -f "$SCRIPT" ]]; then
            echo "ERROR: $SCRIPT not found"
            exit 1
          fi

          # ------------------------------------------------------
          # 版本比较
          # ------------------------------------------------------
          version_gt() {
            if [[ "$1" == "$2" ]]; then
              return 1
            fi

            [[ "$(printf '%s\n' "$1" "$2" | sort -V | tail -n1)" == "$1" ]]
          }

          # ------------------------------------------------------
          # 获取 Git tag 最终 commit
          #
          # 对 annotated tag：
          #
          # refs/tags/<tag>^{}
          #
          # 才是真正的 commit。
          # ------------------------------------------------------
          get_tag_commit() {
            local repo="$1"
            local tag="$2"

            local result
            local commit

            echo "Getting commit for ${repo}:${tag}" >&2

            result="$(
              git ls-remote \
                --tags \
                "https://github.com/${repo}.git" \
                "refs/tags/${tag}" \
                "refs/tags/${tag}^{}"
            )"

            # 优先使用 peeled commit
            commit="$(
              echo "$result" |
              awk '$2 == "refs/tags/'"$tag"'^{}" {
                print $1
                exit
              }'
            )"

            # lightweight tag
            if [[ -z "$commit" ]]; then
              commit="$(
                echo "$result" |
                awk '$2 == "refs/tags/'"$tag"'" {
                  print $1
                  exit
                }'
              )"
            fi

            if [[ -z "$commit" ]]; then
              echo "ERROR: Cannot resolve commit for ${repo}:${tag}" >&2
              echo "$result" >&2
              return 1
            fi

            echo "$commit"
          }

          # ------------------------------------------------------
          # Moby 最新正式版本
          # ------------------------------------------------------
          echo "Finding latest Moby release..."

          MOBY_TAG="$(
            git ls-remote --tags \
              https://github.com/moby/moby.git |
            awk -F/ '
              $3 ~ /^docker-v[0-9]+\.[0-9]+\.[0-9]+$/ {
                print $3
              }
            ' |
            sort -V |
            tail -n1
          )"

          if [[ -z "$MOBY_TAG" ]]; then
            echo "ERROR: Cannot find Moby release tag"
            exit 1
          fi

          MOBY_VERSION="${MOBY_TAG#docker-v}"

          echo ""
          echo "Latest Moby tag:     $MOBY_TAG"
          echo "Latest Docker:       $MOBY_VERSION"

          # ------------------------------------------------------
          # Moby commit
          # ------------------------------------------------------
          MOBY_COMMIT="$(
            get_tag_commit \
              "moby/moby" \
              "$MOBY_TAG"
          )"

          MOBY_COMMIT_SHORT="${MOBY_COMMIT:0:7}"

          echo "Moby commit:         $MOBY_COMMIT"
          echo "Moby short commit:   $MOBY_COMMIT_SHORT"

          # ------------------------------------------------------
          # Moby SHA256
          # ------------------------------------------------------
          MOBY_TARBALL="/tmp/${MOBY_TAG}.tar.gz"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            "https://codeload.github.com/moby/moby/tar.gz/${MOBY_TAG}" \
            -o "$MOBY_TARBALL"

          MOBY_SHA256="$(
            sha256sum "$MOBY_TARBALL" |
            awk '{print $1}'
          )"

          echo "Moby SHA256:         $MOBY_SHA256"

          # ------------------------------------------------------
          # Docker CLI
          # ------------------------------------------------------
          CLI_TAG="v${MOBY_VERSION}"
          CLI_VERSION="$MOBY_VERSION"

          echo ""
          echo "Docker CLI tag:      $CLI_TAG"

          # 检查 CLI tag
          if ! git ls-remote \
              --exit-code \
              --tags \
              https://github.com/docker/cli.git \
              "refs/tags/${CLI_TAG}" \
              "refs/tags/${CLI_TAG}^{}" \
              >/dev/null 2>&1; then

            echo "WARNING: Docker CLI ${CLI_TAG} does not exist."
            echo "Docker update cancelled."
            exit 0
          fi

          # ------------------------------------------------------
          # CLI commit
          # ------------------------------------------------------
          CLI_COMMIT="$(
            get_tag_commit \
              "docker/cli" \
              "$CLI_TAG"
          )"

          CLI_COMMIT_SHORT="${CLI_COMMIT:0:7}"

          echo "CLI commit:          $CLI_COMMIT"
          echo "CLI short commit:    $CLI_COMMIT_SHORT"

          # ------------------------------------------------------
          # CLI SHA256
          # ------------------------------------------------------
          CLI_TARBALL="/tmp/docker-cli-${CLI_TAG}.tar.gz"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            "https://codeload.github.com/docker/cli/tar.gz/${CLI_TAG}" \
            -o "$CLI_TARBALL"

          CLI_SHA256="$(
            sha256sum "$CLI_TARBALL" |
            awk '{print $1}'
          )"

          echo "CLI SHA256:          $CLI_SHA256"

          # ------------------------------------------------------
          # 比较版本
          # ------------------------------------------------------
          if ! version_gt "$MOBY_VERSION" "$BASE_VERSION"; then
            echo ""
            echo "Latest Docker: $MOBY_VERSION"
            echo "Base Docker:   $BASE_VERSION"
            echo ""
            echo "No update required."
            exit 0
          fi

          echo ""
          echo "========================================"
          echo "Docker update detected!"
          echo "${BASE_VERSION} -> ${MOBY_VERSION}"
          echo "========================================"

          # ======================================================
          # 修改 diy-docker.sh
          # ======================================================
          python3 - "$SCRIPT" \
            "$MOBY_VERSION" \
            "$MOBY_COMMIT_SHORT" \
            "$MOBY_SHA256" \
            "$CLI_VERSION" \
            "$CLI_COMMIT_SHORT" \
            "$CLI_SHA256" <<'PY'

          from pathlib import Path
          import re
          import sys

          (
              script,
              moby_version,
              moby_commit,
              moby_sha256,
              cli_version,
              cli_commit,
              cli_sha256,
          ) = sys.argv[1:]

          path = Path(script)
          text = path.read_text()

          # ======================================================
          # 找区域
          # ======================================================

          dockerd_start = text.find("# dockerd")
          docker_start = text.find("# docker", dockerd_start + 1)

          if dockerd_start == -1:
              raise SystemExit(
                  "ERROR: Cannot find '# dockerd'"
              )

          if docker_start == -1:
              raise SystemExit(
                  "ERROR: Cannot find '# docker'"
              )

          dockerd = text[dockerd_start:docker_start]
          docker = text[docker_start:]

          # ======================================================
          # Docker Engine 版本
          #
          # 左侧永远保持 29.1.1
          # ======================================================

          pattern = re.compile(
              r"s/29\.1\.1/[0-9]+\.[0-9]+\.[0-9]+/g"
          )

          if not pattern.search(dockerd):
              raise SystemExit(
                  "ERROR: Moby version pattern not found"
              )

          dockerd = pattern.sub(
              f"s/29.1.1/{moby_version}/g",
              dockerd,
              count=1
          )

          # ======================================================
          # Docker Engine SHA256
          #
          # 找当前 64 位 SHA。
          # ======================================================

          sha_pattern = re.compile(
              r"s/([0-9a-f]{64})/([0-9a-f]{64})/g"
          )

          match = sha_pattern.search(dockerd)

          if not match:
              raise SystemExit(
                  "ERROR: Moby SHA256 pattern not found"
              )

          old_sha = match.group(1)

          dockerd = dockerd.replace(
              match.group(0),
              f"s/{old_sha}/{moby_sha256}/g",
              1
          )

          # ======================================================
          # Docker Engine commit
          #
          # 左侧固定 9a84135
          # ======================================================

          match = re.search(
              r"s/9a84135/[0-9a-f]{7,40}/g",
              dockerd
          )

          if not match:
              raise SystemExit(
                  "ERROR: Moby commit pattern not found"
              )

          dockerd = dockerd.replace(
              match.group(0),
              f"s/9a84135/{moby_commit}/g",
              1
          )

          # ======================================================
          # Docker CLI 版本
          #
          # 左侧仍然固定 29.1.1
          # ======================================================

          if not pattern.search(docker):
              raise SystemExit(
                  "ERROR: Docker CLI version pattern not found"
              )

          docker = pattern.sub(
              f"s/29.1.1/{cli_version}/g",
              docker,
              count=1
          )

          # ======================================================
          # Docker CLI SHA256
          # ======================================================

          match = sha_pattern.search(docker)

          if not match:
              raise SystemExit(
                  "ERROR: Docker CLI SHA256 pattern not found"
              )

          old_sha = match.group(1)

          docker = docker.replace(
              match.group(0),
              f"s/{old_sha}/{cli_sha256}/g",
              1
          )

          # ======================================================
          # Docker CLI commit
          #
          # 左侧固定 0aedba5
          # ======================================================

          match = re.search(
              r"s/0aedba5/[0-9a-f]{7,40}/g",
              docker
          )

          if not match:
              raise SystemExit(
                  "ERROR: Docker CLI commit pattern not found"
              )

          docker = docker.replace(
              match.group(0),
              f"s/0aedba5/{cli_commit}/g",
              1
          )

          # ======================================================
          # 写回
          # ======================================================

          new_text = (
              text[:dockerd_start]
              + dockerd
              + docker
          )

          path.write_text(new_text)

          print("")
          print("========================================")
          print("diy-docker.sh updated")
          print("========================================")
          print(f"Moby version : {moby_version}")
          print(f"Moby commit  : {moby_commit}")
          print(f"Moby SHA256   : {moby_sha256}")
          print("")
          print(f"CLI version  : {cli_version}")
          print(f"CLI commit   : {cli_commit}")
          print(f"CLI SHA256   : {cli_sha256}")
          print("========================================")
          PY

          echo ""
          echo "========================================"
          echo "Updated diy-docker.sh"
          echo "========================================"

          cat "$SCRIPT"
