name: docker auto update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            curl \
            jq \
            zstd \
            file

      # ==========================================================
      # Docker 自动检测 / 更新
      #
      # 29.1.1 永远作为固定基准
      #
      # 重要：
      # 不使用 GitHub API 的 object.sha 作为 commit。
      #
      # 使用：
      #
      # refs/tags/<tag>^{}
      #
      # 获取 tag 最终指向的真实 commit。
      # ==========================================================
      - name: Check and update Docker version
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION="29.1.1"
          SCRIPT="diy_script/diy-docker.sh"

          echo "========================================"
          echo "Docker automatic version detection"
          echo "Fixed base version: ${BASE_VERSION}"
          echo "========================================"

          if [[ ! -f "$SCRIPT" ]]; then
            echo "ERROR: $SCRIPT not found"
            exit 1
          fi

          # ------------------------------------------------------
          # 版本比较
          # ------------------------------------------------------
          version_gt() {
            if [[ "$1" == "$2" ]]; then
              return 1
            fi

            [[ "$(printf '%s\n' "$1" "$2" | sort -V | tail -n1)" == "$1" ]]
          }

          # ------------------------------------------------------
          # 获取 Git tag 对应的真实 commit
          #
          # 关键：
          #
          # refs/tags/v29.7.2
          # refs/tags/v29.7.2^{}
          #
          # ^{} 是 peeled tag，也就是最终 commit。
          #
          # 这样可以正确处理 annotated tag。
          # ------------------------------------------------------
          get_tag_commit() {
            local repo="$1"
            local tag="$2"

            local result
            local commit

            echo "Getting commit for ${repo}:${tag}" >&2

            result="$(
              git ls-remote \
                --tags \
                "https://github.com/${repo}.git" \
                "refs/tags/${tag}" \
                "refs/tags/${tag}^{}"
            )"

            # 优先使用 peeled commit
            commit="$(
              echo "$result" |
              awk '$2 == "refs/tags/'"$tag"'^{}" {print $1; exit}'
            )"

            # 如果是 lightweight tag，则使用普通 tag SHA
            if [[ -z "$commit" ]]; then
              commit="$(
                echo "$result" |
                awk '$2 == "refs/tags/'"$tag"'" {print $1; exit}'
              )"
            fi

            if [[ -z "$commit" ]]; then
              echo "ERROR: Cannot resolve commit for ${repo}:${tag}" >&2
              echo "$result" >&2
              return 1
            fi

            echo "$commit"
          }

          # ------------------------------------------------------
          # 获取 Moby 最新正式版本
          #
          # 只接受：
          #
          # docker-v29.7.2
          #
          # 不接受：
          #
          # docker-v29.7.2-rc1
          # docker-v29.7.2-beta
          # docker-v29.7.2-alpha
          # ------------------------------------------------------
          echo "Finding latest Moby release..."

          MOBY_TAG="$(
            git ls-remote --tags \
              https://github.com/moby/moby.git |
            awk -F/ '
              $3 ~ /^docker-v[0-9]+\.[0-9]+\.[0-9]+$/ {
                print $3
              }
            ' |
            sort -V |
            tail -n1
          )"

          if [[ -z "$MOBY_TAG" ]]; then
            echo "ERROR: Cannot find Moby release tag"
            exit 1
          fi

          MOBY_VERSION="${MOBY_TAG#docker-v}"

          echo ""
          echo "Latest Moby tag:     $MOBY_TAG"
          echo "Latest Docker:       $MOBY_VERSION"

          # ------------------------------------------------------
          # 获取 Moby 真实 commit
          # ------------------------------------------------------
          MOBY_COMMIT="$(
            get_tag_commit \
              "moby/moby" \
              "$MOBY_TAG"
          )"

          MOBY_COMMIT_SHORT="${MOBY_COMMIT:0:7}"

          echo "Moby commit:         $MOBY_COMMIT"
          echo "Moby short commit:   $MOBY_COMMIT_SHORT"

          # ------------------------------------------------------
          # 下载 Moby 源码
          # ------------------------------------------------------
          MOBY_TARBALL="/tmp/${MOBY_TAG}.tar.gz"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            "https://codeload.github.com/moby/moby/tar.gz/${MOBY_TAG}" \
            -o "$MOBY_TARBALL"

          MOBY_SHA256="$(
            sha256sum "$MOBY_TARBALL" |
            awk '{print $1}'
          )"

          echo "Moby SHA256:         $MOBY_SHA256"

          # ------------------------------------------------------
          # Docker CLI
          # ------------------------------------------------------
          CLI_TAG="v${MOBY_VERSION}"

          echo ""
          echo "Docker CLI tag:      $CLI_TAG"

          # 检查 CLI tag 是否存在
          if ! git ls-remote \
              --exit-code \
              --tags \
              https://github.com/docker/cli.git \
              "refs/tags/${CLI_TAG}" \
              "refs/tags/${CLI_TAG}^{}" \
              >/dev/null 2>&1; then

            echo "WARNING: Docker CLI ${CLI_TAG} does not exist."
            echo "Docker update cancelled."
            exit 0
          fi

          # ------------------------------------------------------
          # 获取 CLI 真实 commit
          # ------------------------------------------------------
          CLI_COMMIT="$(
            get_tag_commit \
              "docker/cli" \
              "$CLI_TAG"
          )"

          CLI_COMMIT_SHORT="${CLI_COMMIT:0:7}"

          echo "CLI commit:          $CLI_COMMIT"
          echo "CLI short commit:    $CLI_COMMIT_SHORT"

          # ------------------------------------------------------
          # 下载 CLI 源码
          # ------------------------------------------------------
          CLI_TARBALL="/tmp/docker-cli-${CLI_TAG}.tar.gz"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            "https://codeload.github.com/docker/cli/tar.gz/${CLI_TAG}" \
            -o "$CLI_TARBALL"

          CLI_SHA256="$(
            sha256sum "$CLI_TARBALL" |
            awk '{print $1}'
          )"

          echo "CLI SHA256:          $CLI_SHA256"

          # ------------------------------------------------------
          # 判断是否有更新
          #
          # 29.1.1 永远是固定基准。
          # ------------------------------------------------------
          if ! version_gt "$MOBY_VERSION" "$BASE_VERSION"; then
            echo ""
            echo "Latest Docker $MOBY_VERSION"
            echo "Base Docker   $BASE_VERSION"
            echo ""
            echo "No update required."
            exit 0
          fi

          echo ""
          echo "========================================"
          echo "Docker update detected!"
          echo "${BASE_VERSION} -> ${MOBY_VERSION}"
          echo "========================================"

          # ------------------------------------------------------
          # 修改 diy-docker.sh
          #
          # 不再依赖固定旧 SHA / commit。
          #
          # 当前文件里面是什么，就替换成新的。
          # ------------------------------------------------------
          python3 - "$SCRIPT" \
            "$MOBY_VERSION" \
            "$MOBY_COMMIT_SHORT" \
            "$MOBY_SHA256" \
            "$CLI_VERSION" \
            "$CLI_COMMIT_SHORT" \
            "$CLI_SHA256" <<'PY'

          from pathlib import Path
          import re
          import sys

          (
              script,
              moby_version,
              moby_commit,
              moby_sha256,
              cli_version,
              cli_commit,
              cli_sha256,
          ) = sys.argv[1:]

          path = Path(script)
          text = path.read_text()

          # ======================================================
          # 找到两个区域
          # ======================================================

          dockerd_start = text.find("# dockerd")
          docker_start = text.find("# docker", dockerd_start + 1)

          if dockerd_start == -1:
              raise SystemExit(
                  "ERROR: Cannot find '# dockerd' section"
              )

          if docker_start == -1:
              raise SystemExit(
                  "ERROR: Cannot find '# docker' section"
              )

          dockerd = text[dockerd_start:docker_start]
          docker = text[docker_start:]

          # ======================================================
          # Moby / dockerd
          # ======================================================

          # 版本：
          #
          # 找到：
          #
          # s/29.1.1/29.7.2/g
          #
          # 或者以后：
          #
          # s/29.7.2/30.0.0/g
          #
          # 统一替换右侧目标版本。
          # 左侧 29.1.1 永远保留。
          # ======================================================

          version_pattern = re.compile(
              r"s/29\.1\.1/([0-9]+\.[0-9]+\.[0-9]+)/g"
          )

          if not version_pattern.search(dockerd):
              raise SystemExit(
                  "ERROR: Cannot find fixed base version "
                  "29.1.1 in dockerd section"
              )

          dockerd = version_pattern.sub(
              f"s/29.1.1/{moby_version}/g",
              dockerd,
              count=1,
          )

          # ======================================================
          # Moby SHA256
          #
          # 找到当前 Makefile 中已有的 64 位 SHA。
          # 不写死旧 SHA。
          # ======================================================

          sha_pattern = re.compile(
              r"s/([0-9a-f]{64})/([0-9a-f]{64})/g"
          )

          sha_match = sha_pattern.search(dockerd)

          if not sha_match:
              raise SystemExit(
                  "ERROR: Cannot find Moby SHA256 replacement"
              )

          old_moby_sha = sha_match.group(1)

          dockerd = dockerd.replace(
              f"s/{old_moby_sha}/{sha_match.group(2)}/g",
              f"s/{old_moby_sha}/{moby_sha256}/g",
              1,
          )

          # ======================================================
          # Moby commit
          #
          # 当前：
          #
          # s/9a84135/6a43e3d/g
          #
          # 下一次：
          #
          # s/9a84135/xxxxxxxx/g
          #
          # 左边永远保持 9a84135。
          # ======================================================

          commit_match = re.search(
              r"s/(9a84135)/([0-9a-f]{7,40})/g",
              dockerd,
          )

          if not commit_match:
              raise SystemExit(
                  "ERROR: Cannot find Moby commit replacement"
              )

          dockerd = dockerd.replace(
              commit_match.group(0),
              f"s/9a84135/{moby_commit}/g",
              1,
          )

          # ======================================================
          # Docker CLI
          # ======================================================

          if not version_pattern.search(docker):
              raise SystemExit(
                  "ERROR: Cannot find fixed base version "
                  "29.1.1 in docker CLI section"
              )

          docker = version_pattern.sub(
              f"s/29.1.1/{cli_version}/g",
              docker,
              count=1,
          )

          # ======================================================
          # CLI SHA256
          # ======================================================

          sha_match = sha_pattern.search(docker)

          if not sha_match:
              raise SystemExit(
                  "ERROR: Cannot find Docker CLI SHA256 replacement"
              )

          old_cli_sha = sha_match.group(1)

          docker = docker.replace(
              f"s/{old_cli_sha}/{sha_match.group(2)}/g",
              f"s/{old_cli_sha}/{cli_sha256}/g",
              1,
          )

          # ======================================================
          # CLI commit
          #
          # 左边固定：
          #
          # 0aedba5
          # ======================================================

          commit_match = re.search(
              r"s/(0aedba5)/([0-9a-f]{7,40})/g",
              docker,
          )

          if not commit_match:
              raise SystemExit(
                  "ERROR: Cannot find Docker CLI commit replacement"
              )

          docker = docker.replace(
              commit_match.group(0),
              f"s/0aedba5/{cli_commit}/g",
              1,
          )

          # ======================================================
          # 写回文件
          # ======================================================

          new_text = (
              text[:dockerd_start]
              + dockerd
              + docker
          )

          path.write_text(new_text)

          print("")
          print("========================================")
          print("diy-docker.sh updated")
          print("========================================")
          print(f"Moby version : {moby_version}")
          print(f"Moby commit  : {moby_commit}")
          print(f"Moby SHA256   : {moby_sha256}")
          print("")
          print(f"CLI version  : {cli_version}")
          print(f"CLI commit   : {cli_commit}")
          print(f"CLI SHA256   : {cli_sha256}")
          print("========================================")
          PY

          echo ""
          echo "========================================"
          echo "Updated diy-docker.sh"
          echo "========================================"

          cat "$SCRIPT"

      # ==========================================================
      # 验证
      #
      # 非常重要：
      # 在提交之前再次检查结果。
      # ==========================================================
      - name: Verify Docker update
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="diy_script/diy-docker.sh"

          echo "========================================"
          echo "Verify diy-docker.sh"
          echo "========================================"

          grep -E \
            "s/29\.1\.1/[0-9]+\.[0-9]+\.[0-9]+/g" \
            "$SCRIPT"

          grep -E \
            "s/[0-9a-f]{64}/[0-9a-f]{64}/g" \
            "$SCRIPT"

          echo ""
          echo "Docker Engine:"
          grep "feeds/packages/utils/dockerd/Makefile" "$SCRIPT"

          echo ""
          echo "Docker CLI:"
          grep "feeds/packages/utils/docker/Makefile" "$SCRIPT"

      # ==========================================================
      # 提交自动更新
      # ==========================================================
      - name: Commit Docker update
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- diy_script/diy-docker.sh; then
            echo "No Docker update."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add diy_script/diy-docker.sh

          git commit \
            -m "chore: update Docker version"

          git push
