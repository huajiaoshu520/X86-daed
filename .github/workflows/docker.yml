name: Docker Version Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write


jobs:

  docker-update:

    runs-on: ubuntu-24.04


    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            python3


      - name: Check and update Docker

        shell: bash

        run: |

          set -euo pipefail


          BASE_VERSION="29.1.1"
          SCRIPT="diy_script/diy-docker.sh"


          echo "=============================="
          echo "Docker auto update"
          echo "Base: $BASE_VERSION"
          echo "=============================="



          if [ ! -f "$SCRIPT" ]; then
            echo "$SCRIPT not found"
            exit 1
          fi



          get_commit(){

            repo="$1"
            tag="$2"


            git ls-remote \
              --tags \
              "https://github.com/${repo}.git" \
              "refs/tags/${tag}" \
              "refs/tags/${tag}^{}" |
            awk '
            /\\^\\{\\}$/ {
              print $1
              exit
            }
            /^[0-9a-f]+[[:space:]]/ {
              print $1
              exit
            }
            '

          }




          echo "Find latest Moby"


          MOBY_TAG=$(

            git ls-remote --tags \
              https://github.com/moby/moby.git |

            awk -F/ '
            $3 ~ /^docker-v[0-9]+\.[0-9]+\.[0-9]+$/ {
              print $3
            }' |

            sort -V |

            tail -1

          )


          MOBY_VERSION=${MOBY_TAG#docker-v}



          echo "Moby:"
          echo "$MOBY_TAG"




          MOBY_COMMIT=$(

            get_commit \
              moby/moby \
              "$MOBY_TAG"

          )


          MOBY_SHORT=${MOBY_COMMIT:0:7}



          echo "Commit:"
          echo "$MOBY_SHORT"




          MOBY_FILE="/tmp/${MOBY_TAG}.tar.gz"


          curl -L \
            "https://codeload.github.com/moby/moby/tar.gz/${MOBY_TAG}" \
            -o "$MOBY_FILE"



          MOBY_SHA=$(sha256sum "$MOBY_FILE" | awk '{print $1}')



          echo "SHA256:"
          echo "$MOBY_SHA"






          # Docker CLI


          CLI_VERSION="$MOBY_VERSION"

          CLI_TAG="v${CLI_VERSION}"



          echo "CLI:"
          echo "$CLI_TAG"




          CLI_COMMIT=$(

            get_commit \
              docker/cli \
              "$CLI_TAG"

          )


          CLI_SHORT=${CLI_COMMIT:0:7}




          CLI_FILE="/tmp/docker-cli-${CLI_TAG}.tar.gz"



          curl -L \
            "https://codeload.github.com/docker/cli/tar.gz/${CLI_TAG}" \
            -o "$CLI_FILE"



          CLI_SHA=$(sha256sum "$CLI_FILE" | awk '{print $1}')



          echo "CLI commit:"
          echo "$CLI_SHORT"

          echo "CLI SHA:"
          echo "$CLI_SHA"





          if [ "$MOBY_VERSION" = "$BASE_VERSION" ]; then

            echo "No update"

            exit 0

          fi




          echo "$BASE_VERSION -> $MOBY_VERSION"




          cat > /tmp/update_docker.py <<'PY'

from pathlib import Path
import re
import sys


(
    file,
    moby_version,
    moby_commit,
    moby_sha,
    cli_version,
    cli_commit,
    cli_sha
)=sys.argv[1:]


p=Path(file)

text=p.read_text()



# Docker version

text=re.sub(

    r"s/29\.1\.1/[0-9]+\.[0-9]+\.[0-9]+/g",

    f"s/29.1.1/{moby_version}/g",

    text,

    count=2

)



# Moby sha

text=re.sub(

    r"s/[0-9a-f]{64}/" + moby_sha + "/g",

    lambda m:m.group(0),

    text,

    count=1

)



# Moby commit

text=re.sub(

    r"s/9a84135/[0-9a-f]{7}/g",

    f"s/9a84135/{moby_commit}/g",

    text

)



# CLI sha

text=re.sub(

    r"s/[0-9a-f]{64}/" + cli_sha + "/g",

    lambda m:m.group(0),

    text,

    count=1

)



# CLI commit

text=re.sub(

    r"s/0aedba5/[0-9a-f]{7}/g",

    f"s/0aedba5/{cli_commit}/g",

    text

)



p.write_text(text)

PY





          python3 /tmp/update_docker.py \
            "$SCRIPT" \
            "$MOBY_VERSION" \
            "$MOBY_SHORT" \
            "$MOBY_SHA" \
            "$CLI_VERSION" \
            "$CLI_SHORT" \
            "$CLI_SHA"




          echo "Updated:"
          cat "$SCRIPT"





      - name: Commit update

        shell: bash

        run: |

          set -e


          if git diff --quiet -- diy_script/diy-docker.sh; then

            echo "No changes"

            exit 0

          fi



          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"



          git add diy_script/diy-docker.sh



          git commit \
            -m "chore: update docker version"



          git push
