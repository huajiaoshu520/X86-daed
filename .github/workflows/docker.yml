name: docker auto update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            zstd \
            file


      # ==========================================================
      # Docker 自动检测更新
      #
      # 固定基准:
      #
      # 29.1.1
      #
      # 自动:
      #
      # Moby
      # commit
      # sha256
      #
      # Docker CLI
      # commit
      # sha256
      #
      # 修改:
      #
      # diy_script/diy-docker.sh
      #
      # ==========================================================


      - name: Check and update Docker version

        shell: bash

        run: |

          set -euo pipefail


          BASE_VERSION="29.1.1"

          SCRIPT="diy_script/diy-docker.sh"



          echo "========================================"

          echo "Docker automatic update"

          echo "Base version: $BASE_VERSION"

          echo "========================================"



          if [ ! -f "$SCRIPT" ]; then

            echo "ERROR: $SCRIPT not found"

            exit 1

          fi




          # ------------------------------------------------------
          # 获取 tag 对应真实 commit
          # ------------------------------------------------------

          get_tag_commit(){

            repo="$1"

            tag="$2"


            result=$(git ls-remote \
              --tags \
              "https://github.com/${repo}.git" \
              "refs/tags/${tag}" \
              "refs/tags/${tag}^{}")


            commit=$(echo "$result" |
              awk '$2 ~ /\^\{\}$/ {print $1}')


            if [ -z "$commit" ]; then

              commit=$(echo "$result" |
                awk '$2=="refs/tags/'"$tag"'" {print $1}')

            fi


            echo "$commit"

          }




          # ------------------------------------------------------
          # 找最新 Moby 正式版本
          # ------------------------------------------------------

          MOBY_TAG=$(git ls-remote --tags \
            https://github.com/moby/moby.git |
            awk -F/ '
            $3 ~ /^docker-v[0-9]+\.[0-9]+\.[0-9]+$/ {
                print $3
            }' |
            sort -V |
            tail -n1)



          MOBY_VERSION=${MOBY_TAG#docker-v}



          echo "Moby tag:"
          echo "$MOBY_TAG"


          echo "Docker version:"
          echo "$MOBY_VERSION"




          # ------------------------------------------------------
          # Moby commit
          # ------------------------------------------------------

          MOBY_COMMIT=$(get_tag_commit \
            moby/moby \
            "$MOBY_TAG")



          MOBY_SHORT=${MOBY_COMMIT:0:7}


          echo "Moby commit:"
          echo "$MOBY_SHORT"




          # ------------------------------------------------------
          # Moby sha256
          # ------------------------------------------------------

          MOBY_FILE="/tmp/${MOBY_TAG}.tar.gz"


          curl -L \
            "https://codeload.github.com/moby/moby/tar.gz/${MOBY_TAG}" \
            -o "$MOBY_FILE"



          MOBY_SHA=$(sha256sum "$MOBY_FILE" | awk '{print $1}')



          echo "Moby sha256:"
          echo "$MOBY_SHA"





          # ------------------------------------------------------
          # CLI
          # ------------------------------------------------------

          CLI_TAG="v${MOBY_VERSION}"

          CLI_VERSION="$MOBY_VERSION"



          CLI_COMMIT=$(get_tag_commit \
            docker/cli \
            "$CLI_TAG")



          CLI_SHORT=${CLI_COMMIT:0:7}



          echo "CLI commit:"
          echo "$CLI_SHORT"




          CLI_FILE="/tmp/docker-cli-${CLI_TAG}.tar.gz"


          curl -L \
            "https://codeload.github.com/docker/cli/tar.gz/${CLI_TAG}" \
            -o "$CLI_FILE"



          CLI_SHA=$(sha256sum "$CLI_FILE" | awk '{print $1}')



          echo "CLI sha256:"
          echo "$CLI_SHA"





          # ------------------------------------------------------
          # 判断版本
          # ------------------------------------------------------

          if [ "$MOBY_VERSION" = "$BASE_VERSION" ]; then

            echo "No update."

            exit 0

          fi



          echo ""

          echo "Update detected"

          echo "$BASE_VERSION -> $MOBY_VERSION"






          # ------------------------------------------------------
          # 修改 diy-docker.sh
          # ------------------------------------------------------

          python3 <<PY


from pathlib import Path

import re



path=Path("$SCRIPT")


text=path.read_text()




# Docker版本


text=re.sub(

r"s/29\\.1\\.1/[0-9]+\\.[0-9]+\\.[0-9]+/g",

"s/29.1.1/$MOBY_VERSION/g",

text,

count=1

)





# Engine SHA

text=re.sub(

r"s/[0-9a-f]{64}/$MOBY_SHA/g",

lambda m:

"s/"+m.group(0)[2:-2]+"/$MOBY_SHA/g",

text,

count=1

)





# Engine commit

text=re.sub(

r"s/9a84135/[0-9a-f]{7}/g",

"s/9a84135/$MOBY_SHORT/g",

text,

count=1

)





# CLI SHA

text=re.sub(

r"s/[0-9a-f]{64}/$CLI_SHA/g",

lambda m:

"s/"+m.group(0)[2:-2]+"/$CLI_SHA/g",

text,

count=1

)





# CLI commit

text=re.sub(

r"s/0aedba5/[0-9a-f]{7}/g",

"s/0aedba5/$CLI_SHORT/g",

text,

count=1

)




path.write_text(text)



PY





          echo ""

          echo "Updated file:"

          cat "$SCRIPT"





      # ----------------------------------------------------------
      # 提交
      # ----------------------------------------------------------

      - name: Commit Docker update

        shell: bash

        run: |


          set -e


          if git diff --quiet -- diy_script/diy-docker.sh; then

            echo "No changes"

            exit 0

          fi



          git config user.name \
            "github-actions[bot]"



          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"



          git add diy_script/diy-docker.sh



          git commit \
            -m "chore: update Docker version"



          git push
